version: '3.8'

services:
  mpc-node1:
    build:
      context: ..
      dockerfile: bridge-custody/Dockerfile
    container_name: mpc-node1
    hostname: mpc-node1
    environment:
      - RUST_LOG=bridge_custody=info
      - RUST_BACKTRACE=1
    volumes:
      - ./config/node1.toml:/app/config/node.toml
      - ./data/node1:/data
    networks:
      mpc-network:
        ipv4_address: 172.20.0.11
    ports:
      - "3001:3000"
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  mpc-node2:
    build:
      context: ..
      dockerfile: bridge-custody/Dockerfile
    container_name: mpc-node2
    hostname: mpc-node2
    environment:
      - RUST_LOG=bridge_custody=info
      - RUST_BACKTRACE=1
    volumes:
      - ./config/node2.toml:/app/config/node.toml
      - ./data/node2:/data
    networks:
      mpc-network:
        ipv4_address: 172.20.0.12
    ports:
      - "3002:3000"
      - "8082:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      - mpc-node1

  mpc-node3:
    build:
      context: ..
      dockerfile: bridge-custody/Dockerfile
    container_name: mpc-node3
    hostname: mpc-node3
    environment:
      - RUST_LOG=bridge_custody=info
      - RUST_BACKTRACE=1
    volumes:
      - ./config/node3.toml:/app/config/node.toml
      - ./data/node3:/data
    networks:
      mpc-network:
        ipv4_address: 172.20.0.13
    ports:
      - "3003:3000"
      - "8083:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      - mpc-node1
      - mpc-node2

networks:
  mpc-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24