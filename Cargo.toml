[package]
name = "bridge-custody"
version = "0.1.0"
edition = "2021"

[dependencies]
# Local dependencies
frost-pallas = { path = "../frost-pallas" }

# Zcash stack
zcash_primitives = "0.13"
zcash_client_backend = "0.12"
orchard = "0.7"

# Crypto primitives
pasta_curves = "0.5"
group = "0.13"
ff = "0.13"
sha2 = "0.10"

# Async runtime
tokio = { version = "1.40", features = ["full", "rt-multi-thread", "macros", "signal"] }

# gRPC
tonic = "0.10"
tower = "0.4"
prost = "0.11"

# Solana - TEMPORARILY DISABLED DUE TO ZEROIZE CONFLICT
# solana-client = "1.18"
# solana-sdk = "1.18"
# solana-transaction-status = "1.18"
# anchor-client = "0.29"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"
toml = "0.8"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Utilities
anyhow = "1.0"
thiserror = "1.0"
hex = "0.4"
base64 = "0.21"
bs58 = "0.5"
rand = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

[build-dependencies]
tonic-build = "0.10"

[[bin]]
name = "mpc-node"
path = "src/main.rs"