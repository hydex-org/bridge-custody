[package]
name = "bridge-custody"
version = "0.1.0"
edition = "2021"

[dependencies]
# Local dependencies
frost-pallas = { path = "../frost-pallas" }

# Zcash stack
zcash_primitives = "0.13"
zcash_client_backend = "0.12"
zcash_address = "0.3"
zcash_keys = "0.2"
orchard = "0.7"

# Crypto primitives
pasta_curves = "0.5"
group = "0.13"
ff = "0.13"
sha2 = "0.10"

# Async runtime
tokio = { version = "1.40", features = ["full", "rt-multi-thread", "macros", "signal"] }

# HTTP server/client
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }
reqwest = { version = "0.11", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"
toml = "0.8"

# Utilities
anyhow = "1.0"
thiserror = "1.0"
hex = "0.4"
base64 = "0.21"
bs58 = "0.5"
rand = "0.8"
bech32 = "0.11"
blake2 = "0.10"
bincode = "1.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Solana (minimal deps - avoid solana-client's heavy transitive deps)
solana-sdk = "2.0"

[[bin]]
name = "mpc-node"
path = "src/main.rs"

[[bin]]
name = "create_test_ufvk"
path = "tests/create_test_ufvk.rs"

[[bin]]
name = "test_api_server"
path = "tests/test_api_server.rs"

[lib]
name = "bridge_custody"
path = "src/lib.rs"